<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tijdlijn / Iframe Pagina - Onderwijs Hub</title>
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    /* Zorg dat de pagina en body de volledige hoogte/breedte nemen zonder scrollbalken */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
    }

    /* Iframe vult exact het gehele venster */
    .fullscreen-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Iframe container: vervang de 'src' URL hieronder door je gewenste TimelineJS of andere embed link -->
  <iframe 
    class="fullscreen-iframe" 
    src="https://timeline.knightlab.com/ng/embed/?src=at%3A%2F%2Fdid%3Aplc%3Aogkxxdccswnjfinscxv7ztcj%2Fcom.knightlab.timeline%2Fmwag01hwzwwf&plc=https%3A%2F%2Fplc.directory&resolver=https%3A%2F%2Fbsky.social" 
    title="Westerse Muziekgeschiedenis"
    allowfullscreen>
  </iframe>

  <!-- Hamburger Navigatie Script -->
  <script>
    // 1. Zorg dat alle relevante pagina's in deze lijst staan
    const menuLinks = [
      { label: "🏠 Home", url: "../../index.html" },
      { label: "📚 Ga Terug", url: "index.html"}
    ];

    // 2. Bepaal actieve pagina automatisch voor het menu
    const currentPath = window.location.pathname.split("/").pop() || "index.html";

    // 3. Bouw de menu-HTML op
    const menuItemsHTML = menuLinks.map(link => {
      const isActive = link.url === currentPath ? 'class="active"' : '';
      return `<li><a href="${link.url}" ${isActive}>${link.label}</a></li>`;
    }).join("");

    const navigationHTML = `
      <button class="menu-toggle" id="menuBtn" aria-label="Menu openen">
        ☰ <span>Menu</span>
      </button>
      <nav class="sidebar" id="sidebar">
        <h2>Onderwijspunt</h2>
        <ul>
          ${menuItemsHTML}
        </ul>
      </nav>
    `;

    // 4. Injecteer het menu over het iframe heen
    document.body.insertAdjacentHTML('afterbegin', navigationHTML);

    // 5. Hamburger menu open/dicht klappen
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  </script>
</body>
</html>
